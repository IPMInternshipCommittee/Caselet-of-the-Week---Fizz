<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caselet of the Week: Case Slides</title>
<style>
  :root{
    --navy:#0b1735;
    --navy-2:#073763;
    --sky:#cfe2f3;
    --cream:#eceef1;
    --ink:#1e293b;
  }
  *{
    box-sizing:border-box;
    font-family:Georgia,'Times New Roman',serif;
  }
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--cream);
    color:var(--ink);
  }

  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;
    background:var(--navy);
    color:#fff;
    padding:10px 18px;
    flex-wrap:wrap;
  }
  .topbar h1{
    font-size:15px;margin:0 auto;font-weight:bold;letter-spacing:.3px;
  }

  .bottombar{
    display:flex;align-items:center;justify-content:center;
    background:var(--navy);
    padding:10px 18px;
    flex-shrink:0;
  }
  #quizToggle{
    border:none;background:var(--sky);color:var(--navy-2);
    font-size:14px;font-weight:bold;
    padding:10px 26px;border-radius:8px;cursor:pointer;
    white-space:nowrap;
    transition:background .15s ease,transform .1s ease;
  }
  #quizToggle:hover{ background:#e2eefb; }
  #quizToggle:active{ transform:scale(0.97); }
  #quizToggle.open{ background:#ffffff; }

  body{
    display:flex;
    flex-direction:column;
  }
  .stage{
    display:flex;
    flex:1;
    min-height:0;
    width:100%;
  }
  .pane{
    position:relative;
    display:flex;
    flex-direction:column;
    min-width:0;
    border-right:1px solid #d7dbe2;
  }
  .pane:last-child{ border-right:none; }

  .pane.slidesMain{
    flex:1 1 100%;
    transition:flex-basis .25s ease;
  }

  .pane.quizSide{
    flex:0 0 0%;
    width:0;
    overflow:hidden;
    transition:flex-basis .25s ease;
  }

  .stage.quiz-open .pane.slidesMain{ flex:1 1 55%; }
  .stage.quiz-open .pane.quizSide{ flex:1 1 45%; width:auto; }

  .pane-header{
    background:var(--sky);
    color:var(--navy-2);
    font-size:12.5px;
    font-weight:bold;
    padding:6px 12px;
    letter-spacing:.3px;
    text-transform:uppercase;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .pane-header a{
    color:var(--navy-2);
    font-size:11px;
    text-decoration:none;
    border:1px solid var(--navy-2);
    border-radius:5px;
    padding:2px 7px;
  }
  .pane-header a:hover{ background:var(--navy-2); color:#fff; }

  iframe{
    flex:1;
    width:100%;
    border:none;
    background:#fff;
  }

  /* ===== LAPTOP / DESKTOP (default, >1024px) ===== */
  /* Split view managed by .stage.quiz-open */

  /* ===== TABLET (601px–1024px) ===== */
  @media only screen and (min-width:601px) and (max-width:1024px){
    .stage.quiz-open .pane.slidesMain{ flex:1 1 50%; }
    .stage.quiz-open .pane.quizSide{ flex:1 1 50%; width:auto; }
    .pane-header{ font-size:12px; padding:6px 10px; }
    #quizToggle{ font-size:13px; padding:9px 22px; }
  }

  /* ===== PHONE (≤600px) ===== */
  @media only screen and (max-width:600px){
    .stage.quiz-open{ flex-direction:column; }
    .stage.quiz-open .pane.slidesMain{ flex:1 1 50%; border-right:none; border-bottom:1px solid #d7dbe2; }
    .stage.quiz-open .pane.quizSide{ flex:1 1 50%; width:auto; }
    .topbar h1{ font-size:13px; }
    .pane-header{ font-size:11px; padding:5px 10px; }
    .pane-header a{ font-size:10px; padding:2px 6px; }
    #quizToggle{ font-size:13px; padding:9px 20px; }
  }
</style>
</head>
<body>

  <div class="topbar">
    <h1>Caselet of the Week &nbsp;|&nbsp; FIZZ: The Flat Sales Diagnostic</h1>
  </div>

  <div class="stage" id="stage">

    <div class="pane quizSide">
      <div class="pane-header">
        <span>Quiz</span>
        <a href="https://ipminternshipcommittee.github.io/Caselet-of-the-Week---Fizz/quiz/index.html" target="_blank" rel="noopener">Open ↗</a>
      </div>
      <iframe
        id="quizFrame"
        data-src="https://ipminternshipcommittee.github.io/Caselet-of-the-Week---Fizz/quiz/index.html"
        title="Caselet Quiz" loading="lazy"></iframe>
    </div>

  </div>

  <div class="bottombar">
    <button id="quizToggle">📝 Take the Quiz</button>
  </div>

  <script>
    const stage = document.getElementById('stage');
    const btn = document.getElementById('quizToggle');
    const quizFrame = document.getElementById('quizFrame');
    let quizLoaded = false;

    btn.addEventListener('click', () => {
      const isOpen = stage.classList.toggle('quiz-open');

      if (isOpen && !quizLoaded) {
        quizFrame.src = quizFrame.dataset.src;
        quizLoaded = true;
      }

      btn.textContent = isOpen ? '✕ Hide Quiz' : '📝 Take the Quiz';
      btn.classList.toggle('open', isOpen);
    });
  </script>

</body>
</html>
