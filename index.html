<script>
  // --- Split Pane Layout Toggle ---
  const stage = document.getElementById('stage');
  const btn = document.getElementById('quizToggle');
  const quizFrame = document.getElementById('quizFrame');
  let quizLoaded = false;

  btn.addEventListener('click', () => {
    const isOpen = stage.classList.toggle('quiz-open');

    if (isOpen && !quizLoaded) {
      quizFrame.src = quizFrame.dataset.src;
      quizLoaded = true;
    }

    btn.textContent = isOpen ? '✕ Hide Quiz' : '📝 Take the Quiz';
    btn.classList.toggle('open', isOpen);
  });

  // --- Embedded Carousel Navigation ---
  const slides = document.querySelectorAll('.carousel-slide');
  const dots = document.querySelectorAll('.dot');
  const slideNum = document.getElementById('slideNum');
  const carouselEl = document.getElementById('carousel');
  let currentSlide = 0;

  function showSlide(index) {
    if (index >= slides.length) currentSlide = 0;
    else if (index < 0) currentSlide = slides.length - 1;
    else currentSlide = index;

    slides.forEach((s, i) => s.classList.toggle('active', i === currentSlide));
    dots.forEach((d, i) => d.classList.toggle('active', i === currentSlide));
    slideNum.textContent = `Slide ${currentSlide + 1} of ${slides.length}`;
  }

  document.getElementById('nextSlide').addEventListener('click', (e) => {
    e.stopPropagation();
    showSlide(currentSlide + 1);
  });

  document.getElementById('prevSlide').addEventListener('click', (e) => {
    e.stopPropagation();
    showSlide(currentSlide - 1);
  });

  dots.forEach((dot, idx) => {
    dot.addEventListener('click', () => showSlide(idx));
  });

  // --- 1. Two-Finger Laptop Trackpad Swipe (No Clicking Required) ---
  let wheelDebounce = false;
  carouselEl.addEventListener('wheel', (e) => {
    if (Math.abs(e.deltaX) > Math.abs(e.deltaY) && Math.abs(e.deltaX) > 25) {
      e.preventDefault();
      if (wheelDebounce) return;
      
      wheelDebounce = true;
      if (e.deltaX > 0) {
        showSlide(currentSlide + 1); // Trackpad swipe left -> Next
      } else {
        showSlide(currentSlide - 1); // Trackpad swipe right -> Prev
      }
      
      setTimeout(() => { wheelDebounce = false; }, 400);
    }
  }, { passive: false });

  // --- 2. Mobile Touch Screen Swipe ---
  let touchStartX = 0;
  let touchStartY = 0;

  carouselEl.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  carouselEl.addEventListener('touchend', (e) => {
    const diffX = touchStartX - e.changedTouches[0].clientX;
    const diffY = touchStartY - e.changedTouches[0].clientY;
    const threshold = 35;

    if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > threshold) {
      if (diffX > 0) {
        showSlide(currentSlide + 1); // Mobile swipe left -> Next
      } else {
        showSlide(currentSlide - 1); // Mobile swipe right -> Prev
      }
    }
  }, { passive: true });
</script>
